# SparkApplication CRD managed by Spark Operator
# This defines how the Spark job runs on Kubernetes

apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: pyspark-etl
spec:
  # Python-based Spark job
  type: Python

  # Run Spark in cluster mode
  mode: cluster

  # Docker image containing the PySpark job
  image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

  # Path inside container to the main application file
  mainApplicationFile: local:///app/etl/main.py

  sparkVersion: "3.5.0"

  # Job will not restart automatically after completion
  restartPolicy:
    type: Never

  # Driver configuration
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark

  # Executor configuration
  executor:
    cores: 1
    instances: 2
    memory: 2g